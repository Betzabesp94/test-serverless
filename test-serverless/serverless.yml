# "service" is the name of this project. This will also be added to your AWS resource names.
service: test-serverless

provider:
  name: aws
  runtime: nodejs22.x
  environment:
    NODE_ENV: ${opt:stage, 'dev'}
    CLERK_PEM_PUBLIC_KEY: ${env:CLERK_PEM_PUBLIC_KEY}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    JWT_SECRET: ${env:JWT_SECRET}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
    OFFLINE_AWS_REGION: ${env:OFFLINE_AWS_REGION, 'us-east-1'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: 
            - "arn:aws:secretsmanager:us-east-1:529673395489:secret:JWT_SECRET*"
            - "arn:aws:secretsmanager:us-east-1:529673395489:secret:jwtSecretDev-EdOsYu"
            - "arn:aws:secretsmanager:us-east-1:529673395489:secret:jwtSecretDev"


  httpApi:
#    authorizers:
#      customAuthorizer:
#        type: request
#        functionName: authorizerFunc
#        simpleResponse: true
#        identitySource:
#          - $request.header.Authorization
#          - $request.header.authorization


functions: ${file(./src/serverless-config/dev/functions.yml)}

plugins:
  - serverless-offline

custom: 
  serverless-offline:
    httpPort: ${env:PORT, 3001} # To use the param port white ${self:custom.myParams.PORT, 3001}
  myParams:
    PORT: 3005

